<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">İlk kâra kadar sıfır gelir veya kurumlar vergisi</title>
<desc id="d">Yeni bir işletmenin zaman çizelgesi. Kuruluştan ilk kârlı yıla kadar gelir veya kurumlar vergisi sıfırdır. İlk kârlı yıldan sonra oran adım adım normal orana yükselir. Girişim vergi durumu kartı güncel aşamayı, ödenecek vergiyi ve bir sonraki aşamayı gösterir.</desc>
<rect x="1" y="1" width="898" height="468" rx="16" fill="#f8faf9" stroke="#d9e2de" stroke-width="1.5"/>
<line x1="80" y1="170" x2="80" y2="360" stroke="#8c9994" stroke-width="2"/>
<text x="62" y="265" font-size="13" fill="#5f6f68" text-anchor="middle" transform="rotate(-90 62 265)">Gelir veya kurumlar vergisi</text>
<line x1="80" y1="200" x2="860" y2="200" stroke="#c9d3cf" stroke-width="2" stroke-dasharray="8 6"/>
<text x="860" y="190" font-size="14" fill="#5f6f68" text-anchor="end" font-weight="600">Normal oran</text>
<rect x="100" y="326" width="380" height="34" rx="4" fill="#dfeae7"/>
<text x="290" y="349" font-size="18" fill="#3f7f73" text-anchor="middle" font-weight="700">Sıfır vergi</text>
<line x1="480" y1="150" x2="480" y2="360" stroke="#b8654a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="480" y="142" font-size="15" fill="#b8654a" text-anchor="middle" font-weight="700">İlk kârlı yıl</text>
<path d="M100,360 L480,360 L480,320 L570,320 L570,280 L660,280 L660,240 L740,240 L740,200 L860,200" fill="none" stroke="#3f7f73" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80" y1="360" x2="870" y2="360" stroke="#2f3b36" stroke-width="2.5"/>
<line x1="100" y1="360" x2="100" y2="370" stroke="#2f3b36" stroke-width="2"/>
<line x1="480" y1="360" x2="480" y2="370" stroke="#2f3b36" stroke-width="2"/>
<line x1="740" y1="360" x2="740" y2="370" stroke="#2f3b36" stroke-width="2"/>
<line x1="860" y1="360" x2="860" y2="370" stroke="#2f3b36" stroke-width="2"/>
<text x="100" y="392" font-size="15" fill="#2f3b36" text-anchor="start" font-weight="600">Kuruluş</text>
<text x="300" y="392" font-size="15" fill="#2f3b36" text-anchor="middle" font-weight="600">Girişim: kâr yok</text>
<text x="610" y="392" font-size="15" fill="#2f3b36" text-anchor="middle" font-weight="600">Kademeli geçiş</text>
<text x="800" y="392" font-size="15" fill="#2f3b36" text-anchor="middle" font-weight="600">Normal</text>
<line x1="240" y1="172" x2="240" y2="324" stroke="#8c9994" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="100" y="34" width="290" height="138" rx="12" fill="#ffffff" stroke="#3f7f73" stroke-width="2"/>
<path d="M100,46 Q100,34 112,34 L378,34 Q390,34 390,46 L390,72 L100,72 Z" fill="#3f7f73"/>
<text x="116" y="59" font-size="15" fill="#ffffff" font-weight="700">Girişim vergi durumu kartı</text>
<text x="116" y="100" font-size="14" fill="#2f3b36" font-weight="600">Aşama: Girişim</text>
<text x="116" y="126" font-size="14" fill="#2f3b36">Gelir veya kurumlar vergisi: 0</text>
<text x="116" y="152" font-size="14" fill="#5f6f68">Sonraki: ilk kârdan sonra geçiş</text>
<circle cx="364" cy="96" r="9" fill="#6f9a90"/>
<text x="450" y="446" font-size="17" fill="#2f3b36" text-anchor="middle" font-weight="600">Kâr yoksa gelir vergisi yok; ilk kârdan sonra normal orana kısa ve kademeli geçiş</text>
</svg>
