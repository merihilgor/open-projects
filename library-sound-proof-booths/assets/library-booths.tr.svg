<title id="t">Ses yalıtımlı kabinler, kütüphane sessizliğini bozmadan sesli öğrenmeye alan açar</title>
<desc id="d">Bir kütüphanenin kesiti. Solda masalarda okuyucuların olduğu sessiz okuma salonu. Sağda bir kişinin görüntülü görüşme yaptığı tek kişilik ses yalıtımlı kabin ve üç kişinin konuştuğu küçük grup kabini; ses kabin duvarlarının içinde kalıyor.</desc>
