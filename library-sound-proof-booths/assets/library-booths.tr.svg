<text x="675" y="70" font-size="18" fill="#2f3b36" text-anchor="middle" font-weight="700">Ses yalıtımlı kabinler</text>
<text x="240" y="96" font-size="14" fill="#5f6f68" text-anchor="middle">Okuma ve çalışma, tam sessizlik</text>
