<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Only the evidence of a violation leaves the car</title>
<desc id="d">Top-down view of a road: a car with an approved dashcam records a vehicle weaving onto the hard shoulder. A sealed evidence package with three still images, time, location and violation type goes through the driver's phone to the traffic police, which checks it automatically or by an officer. All other footage stays in the car.</desc>
