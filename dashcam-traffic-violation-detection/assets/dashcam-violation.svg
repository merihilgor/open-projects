<rect x="118" y="300" width="44" height="76" rx="10" fill="#6f9a90" stroke="#2f3b36" stroke-width="2"/><rect x="124" y="312" width="32" height="14" rx="3" fill="#dfeae7" stroke="#2f3b36" stroke-width="1.5"/><rect x="124" y="354" width="32" height="10" rx="3" fill="#dfeae7" stroke="#2f3b36" stroke-width="1.5"/>
