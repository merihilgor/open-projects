<text x="508" y="391" font-size="15" fill="#3f7f73" font-weight="600">All other footage stays in the car</text>
<text x="450" y="450" font-size="17" fill="#2f3b36" text-anchor="middle" font-weight="600">Only the evidence of a violation leaves the car; everything else stays on the device</text>
