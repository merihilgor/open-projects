<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Whoever hires the agent pays the brokerage fee</title>
<desc id="d">Two panels. Left, today: the owner hires an agent, but the fee is split, so the buyer or tenant also pays half and filters searches to by-owner listings only. Right, the proposal: the owner who hired the agent pays the whole fee, and the buyer or tenant pays nothing and searches all listings.</desc>
<rect x="1" y="1" width="898" height="468" rx="16" fill="#f8faf9" stroke="#d9e2de" stroke-width="1.5"/>
<defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3f7f73"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b8654a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8c9994"/></marker></defs>
<rect x="30" y="60" width="410" height="335" rx="12" fill="#ffffff" stroke="#e2c3b6" stroke-width="1.5"/>
<text x="235" y="94" font-size="16" fill="#b8654a" text-anchor="middle" font-weight="700">Today: the fee is split between both sides</text>
<rect x="99" y="170" width="52" height="38" fill="#6f9a90" stroke="#2f3b36" stroke-width="2"/>
<path d="M91,172 L125,142 L159,172 Z" fill="#3c4a45" stroke="#2f3b36" stroke-width="2" stroke-linejoin="round"/>
<rect x="118" y="188" width="14" height="20" fill="#dfeae7" stroke="#2f3b36" stroke-width="1.5"/>
<text x="125" y="232" font-size="15" fill="#2f3b36" text-anchor="middle" font-weight="600">Owner</text>
<text x="125" y="250" font-size="13" fill="#5f6f68" text-anchor="middle">(seller or landlord)</text>
<circle cx="350" cy="160" r="13" fill="#3f7f73" stroke="#2f3b36" stroke-width="2"/>
<path d="M324,208 Q324,178 350,178 Q376,178 376,208 Z" fill="#3f7f73" stroke="#2f3b36" stroke-width="2" stroke-linejoin="round"/>
<text x="350" y="134" font-size="15" fill="#2f3b36" text-anchor="middle" font-weight="600">Agent</text>
<circle cx="125" cy="300" r="13" fill="#dfeae7" stroke="#2f3b36" stroke-width="2"/>
<path d="M99,348 Q99,318 125,318 Q151,318 151,348 Z" fill="#dfeae7" stroke="#2f3b36" stroke-width="2" stroke-linejoin="round"/>
<text x="125" y="372" font-size="15" fill="#2f3b36" text-anchor="middle" font-weight="600">Buyer or tenant</text>
<line x1="165" y1="158" x2="315" y2="158" stroke="#8c9994" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ak)"/>
<text x="238" y="149" font-size="13" fill="#5f6f68" text-anchor="middle" font-style="italic">hires</text>
<line x1="165" y1="196" x2="310" y2="196" stroke="#3f7f73" stroke-width="3" marker-end="url(#ag)"/>
<text x="238" y="220" font-size="14" fill="#3f7f73" text-anchor="middle" font-weight="600">Pays 50%</text>
<line x1="155" y1="300" x2="326" y2="214" stroke="#b8654a" stroke-width="3" marker-end="url(#ar)"/>
<text x="280" y="272" font-size="14" fill="#b8654a" text-anchor="start" font-weight="600">Pays 50%</text>
<rect x="190" y="318" width="230" height="30" rx="15" fill="#f6e4dc" stroke="#b8654a" stroke-width="1.5"/>
<circle cx="210" cy="331" r="6" fill="none" stroke="#8a4a35" stroke-width="2"/><line x1="214" y1="335" x2="219" y2="340" stroke="#8a4a35" stroke-width="2" stroke-linecap="round"/>
<text x="315" y="338" font-size="13" fill="#8a4a35" text-anchor="middle" font-weight="600">Filter: by owner only</text>
<rect x="460" y="60" width="410" height="335" rx="12" fill="#ffffff" stroke="#b9d3cc" stroke-width="1.5"/>
<text x="665" y="94" font-size="16" fill="#3f7f73" text-anchor="middle" font-weight="700">Proposal: whoever hires the agent pays</text>
<rect x="529" y="170" width="52" height="38" fill="#6f9a90" stroke="#2f3b36" stroke-width="2"/>
<path d="M521,172 L555,142 L589,172 Z" fill="#3c4a45" stroke="#2f3b36" stroke-width="2" stroke-linejoin="round"/>
<rect x="548" y="188" width="14" height="20" fill="#dfeae7" stroke="#2f3b36" stroke-width="1.5"/>
<text x="555" y="232" font-size="15" fill="#2f3b36" text-anchor="middle" font-weight="600">Owner</text>
<text x="555" y="250" font-size="13" fill="#5f6f68" text-anchor="middle">(seller or landlord)</text>
<circle cx="780" cy="160" r="13" fill="#3f7f73" stroke="#2f3b36" stroke-width="2"/>
<path d="M754,208 Q754,178 780,178 Q806,178 806,208 Z" fill="#3f7f73" stroke="#2f3b36" stroke-width="2" stroke-linejoin="round"/>
<text x="780" y="134" font-size="15" fill="#2f3b36" text-anchor="middle" font-weight="600">Agent</text>
<circle cx="555" cy="300" r="13" fill="#dfeae7" stroke="#2f3b36" stroke-width="2"/>
<path d="M529,348 Q529,318 555,318 Q581,318 581,348 Z" fill="#dfeae7" stroke="#2f3b36" stroke-width="2" stroke-linejoin="round"/>
<text x="555" y="372" font-size="15" fill="#2f3b36" text-anchor="middle" font-weight="600">Buyer or tenant</text>
<line x1="595" y1="158" x2="745" y2="158" stroke="#8c9994" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ak)"/>
<text x="668" y="149" font-size="13" fill="#5f6f68" text-anchor="middle" font-style="italic">hires</text>
<line x1="595" y1="196" x2="740" y2="196" stroke="#3f7f73" stroke-width="5" marker-end="url(#ag)"/>
<text x="668" y="220" font-size="14" fill="#3f7f73" text-anchor="middle" font-weight="600">Pays 100%</text>
<text x="710" y="272" font-size="14" fill="#3f7f73" text-anchor="start" font-weight="600">Pays nothing</text>
<rect x="620" y="318" width="230" height="30" rx="15" fill="#e3efeb" stroke="#3f7f73" stroke-width="1.5"/>
<circle cx="640" cy="331" r="6" fill="none" stroke="#2f5f56" stroke-width="2"/><line x1="644" y1="335" x2="649" y2="340" stroke="#2f5f56" stroke-width="2" stroke-linecap="round"/>
<text x="745" y="338" font-size="13" fill="#2f5f56" text-anchor="middle" font-weight="600">Searches all listings</text>
<text x="450" y="440" font-size="18" fill="#2f3b36" text-anchor="middle" font-weight="600">Whoever hires the agent pays: the seller in a sale, the landlord in a rental</text>
</svg>
