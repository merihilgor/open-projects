<title id="t">Leaving home: everything except the alarm and fridge is switched off at the panel</title>
<desc id="d">An electrical panel with ten smart relay channels on two rails. In away mode only the alarm and fridge channels stay on; kettle, iron, heater, oven, lights, sockets, washer and TV are switched off. A phone next to the panel shows the Leaving home and Night mode buttons.</desc>
