<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="Açma kolunun üstünde sürgülü havalandırması olan pimapen tipi pencerenin önden görünümü" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
