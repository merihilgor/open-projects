<title id="t">Bina düzeyinde posta kodu ve kapı numarası tek ve doğrulanmış bir tam adres verir</title>
<desc id="d">Yan yana iki adres formu. Solda, bugün: yazım hataları ve belirsiz kısımlarla dolu serbest metin adres kutusu; girişte kontrol edilemez, birden fazla olası eşleşmeye ve başarısız teslimatlara yol açar. Sağda, bina düzeyinde posta koduyla: kullanıcı posta kodunu ve kapı numarasını girer, tek ve doğrulanmış tam adres otomatik doldurulur.</desc>
