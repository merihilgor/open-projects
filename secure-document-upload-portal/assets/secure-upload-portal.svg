<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Sensitive documents go straight to the institution, without copies left behind</title>
<desc id="d">Two lanes. Top, today: an applicant's documents pass through a copy shop, a courier and an intermediary before reaching a consulate or institution, and a copy is kept at each step. Bottom, the proposal: the applicant logs in with their digital identity and uploads the documents once to a trusted, state-hosted portal, which sends them securely to the institution; only authorized staff see them, access is time-limited and logged, and the files are deleted after use.</desc>
