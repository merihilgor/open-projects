<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">Publisher revenue in AI answers</title><desc id="d">When AI reads the source, the source gets paid</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#2b3a36}.h{font-size:23px;font-weight:700}.s{font-size:15px;fill:#55655f}.b{font-size:15px;font-weight:700}.m{font-size:14px;fill:#55655f}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7b4fb5"/></marker></defs><rect x="1" y="1" width="998" height="608" rx="16" fill="#f8faf9" stroke="#dfe6e3"/><text x="45" y="48" class="h">Publisher revenue in AI answers</text><text x="45" y="76" class="s">When AI reads the source, the source gets paid</text><rect x="45" y="100" width="420" height="110" rx="12" fill="#fff" stroke="#dfe6e3"/><text x="61" y="126" style="font-size:13px;font-weight:700;fill:#7b4fb5">1</text><text x="81" y="126" class="b">Registered source</text><text x="61" y="156" class="m">Sets its own terms for AI use:</text><text x="61" y="178" class="m">with its ads, a per-use fee, both, or none</text><line x1="468" y1="155" x2="529" y2="155" stroke="#7b4fb5" stroke-width="2.5" marker-end="url(#ar)"/><rect x="535" y="100" width="420" height="110" rx="12" fill="#fff" stroke="#dfe6e3"/><text x="551" y="126" style="font-size:13px;font-weight:700;fill:#7b4fb5">2</text><text x="571" y="126" class="b">AI answers the user</text><text x="551" y="156" class="m">Uses the source's content and</text><text x="551" y="178" class="m">always cites it with a link</text><line x1="745" y1="212" x2="745" y2="262" stroke="#7b4fb5" stroke-width="2.5" marker-end="url(#ar)"/><path d="M745 236 L255 236 L255 262" fill="none" stroke="#7b4fb5" stroke-width="2.5" marker-end="url(#ar)"/><rect x="45" y="268" width="420" height="122" rx="12" fill="#f1f8f5" stroke="#a9d3c2"/><text x="61" y="294" style="font-size:13px;font-weight:700;fill:#7b4fb5">3a</text><text x="87" y="294" class="b" style="fill:#2f6f5e">Free session</text><text x="61" y="322" class="m">Answer + a capped, labelled ad block</text><text x="61" y="344" class="m">from the source's own ads, outside the answer</text><text x="61" y="366" class="m">Cached content: counted per display or click</text><rect x="535" y="268" width="420" height="122" rx="12" fill="#f7f2fc" stroke="#cbb8e6"/><text x="551" y="294" style="font-size:13px;font-weight:700;fill:#7b4fb5">3b</text><text x="577" y="294" class="b" style="fill:#5b3591">Paid session (ad-free)</text><text x="551" y="322" class="m">No ads for the user</text><text x="551" y="344" class="m">The AI provider pays a small fee</text><text x="551" y="366" class="m">per retrieval or per cached display</text><line x1="255" y1="392" x2="255" y2="424" stroke="#7b4fb5" stroke-width="2.5" marker-end="url(#ar)"/><text x="267" y="414" class="m" style="font-weight:700;fill:#2f6f5e">ad revenue share</text><line x1="745" y1="392" x2="745" y2="424" stroke="#7b4fb5" stroke-width="2.5" marker-end="url(#ar)"/><text x="757" y="414" class="m" style="font-weight:700;fill:#5b3591">per-use fee</text><rect x="45" y="430" width="910" height="78" rx="12" fill="#fff" stroke="#cbb8e6"/><text x="61" y="456" style="font-size:13px;font-weight:700;fill:#7b4fb5">4</text><text x="81" y="456" class="b">Neutral clearing</text><text x="61" y="486" class="m">Counts uses, audits them and pays each source by its share of the answer</text><path d="M45 470 L24 470 L24 155 L39 155" fill="none" stroke="#7b4fb5" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/><rect x="45" y="526" width="910" height="64" rx="12" fill="#efe7f7"/><text x="65" y="553" class="b" style="fill:#5b3591">Independently certified sources carry a trust label</text><text x="65" y="575" class="m">Ads and fees never change what the answer says; no profiling from conversations</text></svg>
