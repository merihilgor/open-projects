<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Dijital kimlik girişiyle hukuken geçerli e-dilekçe, her vatandaşa ücretsiz</title>
<desc id="d">İki şerit. Üstte bugün: vatandaş, hukuken geçerli bir dilekçenin kuruma ulaşması için kayıtlı e-posta paketi satın almak ve e-imza için ek ücret ödemek zorundadır. Altta öneri: vatandaş zaten sahip olduğu dijital kimlikle giriş yapar ve kayıtlı e-dilekçeyi ücretsiz gönderir; yanıt da aynı gelen kutusuna gelir.</desc>
