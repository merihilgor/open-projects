<text x="45" y="112" class="m">Sözleşme tutarı (para veya değerli varlık)</text><rect x="45" y="124" width="430" height="26" rx="6" fill="#d7ece3"/><rect x="475" y="124" width="480" height="26" rx="6" fill="#e6dcf3"/><line x1="475" y1="116" x2="475" y2="158" stroke="#2b3a36" stroke-width="3"/><text x="485" y="112" class="m" style="font-weight:700;fill:#2b3a36">sınır, her yıl gözden geçirilir</text><text x="60" y="142" class="m" style="fill:#2f6f5e;font-weight:700">Altı: adi sözleşme yeterli</text><text x="490" y="142" class="m" style="fill:#5b3591;font-weight:700">Üstü: noter onayı + güvenli akış</text><text x="45" y="196" class="b" style="fill:#55655f">İmzadan önce</text><rect x="45" y="208" width="200" height="120" rx="12" fill="#fff" stroke="#dfe6e3"/><text x="61" y="234" style="font-size:13px;font-weight:700;fill:#7b4fb5">1</text><g transform="translate(145.0 250)"><rect x="-14" y="-18" width="28" height="36" rx="3" fill="#fff" stroke="#55655f" stroke-width="2"/><line x1="-8" y1="-8" x2="8" y2="-8" stroke="#8a9a95" stroke-width="2"/><line x1="-8" y1="-1" x2="8" y2="-1" stroke="#8a9a95" stroke-width="2"/><line x1="-8" y1="6" x2="4" y2="6" stroke="#8a9a95" stroke-width="2"/></g><text x="145.0" y="294" class="b" text-anchor="middle">Taslak</text><text x="145.0" y="314" class="m" text-anchor="middle">sözleşme metni</text><line x1="248" y1="268" x2="271" y2="268" stroke="#7b4fb5" stroke-width="2.5" marker-end="url(#ar)"/><rect x="275" y="208" width="200" height="120" rx="12" fill="#fff" stroke="#dfe6e3"/><text x="291" y="234" style="font-size:13px;font-weight:700;fill:#7b4fb5">2</text><g transform="translate(375.0 250)"><rect x="-20" y="-14" width="40" height="26" rx="3" fill="#e3eef8" stroke="#5f7fa6" stroke-width="2"/><path d="M0 8 L0 -6 M-6 0 L0 -6 L6 0" fill="none" stroke="#5f7fa6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="12" width="16" height="4" fill="#5f7fa6"/></g><text x="375.0" y="294" class="b" text-anchor="middle">