 y="378" width="200" height="120" rx="12" fill="#fff" stroke="#cbb8e6"/><text x="751" y="404" style="font-size:13px;font-weight:700;fill:#7b4fb5">8</text><g transform="translate(835.0 420)"><path d="M-18 8 C-12 -6 -6 14 0 2 C4 -6 8 8 18 -2" fill="none" stroke="#2b3a36" stroke-width="2.5" stroke-linecap="round"/><line x1="-20" y1="16" x2="20" y2="16" stroke="#8a9a95" stroke-width="2"/></g><text x="835.0" y="464" class="b" text-anchor="middle">İmza</text><text x="835.0" y="484" class="m" text-anchor="middle">ıslak, dijital, biyometrik</text><path d="M835.0 330 L835.0 346 L215 346 L215 372" fill="none" stroke="#7b4fb5" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/><rect x="45" y="520" width="910" height="64" rx="12" fill="#efe7f7"/><text x="65" y="547" class="b" style="fill:#5b3591">Aynı akış vekâletname ve avukat vekâleti için de geçerli</text><text x="65" y="569" class="m">Soruları cevaplayamayan tarafın imzası zorlanmaz, ertelenir</text>
