<title id="t">Ay içinde alışveriş, faturalama ve lojistik yükü nereye düşüyor</title>
<desc id="d">Bir aylık iki panel. Üstte: tek ortak maaş gününün hemen ardından tek büyük yük tepesi. Altta: ayın 7'si, 14'ü, 21'i ve 28'indeki maaş günlerinin ardından dört küçük ve dengeli tepe. Temsilidir, ölçülmüş veri değildir.</desc>
